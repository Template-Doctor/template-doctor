name: Build and Deploy Azure Functions v4

on:
  push:
    branches: [main]
    paths:
  - "packages/api/**"
  pull_request:
    branches: [main]
    paths:
  - "packages/api/**"
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './packages/api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install Dependencies
        run: |
          npm ci --workspaces
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          npm run build

      - name: Ensure Node version
        run: node scripts/ensure-node-version.js

      - name: Unit Tests (root)
        run: npm run test:unit
      - name: Package API (already built)
        run: ls -1 ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/dist || (echo 'dist missing' && exit 1)
          
      - name: 'Deploy to Azure Functions'
        if: github.event_name != 'pull_request'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}